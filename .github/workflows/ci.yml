# Brainstorm native-helper CI: bit-exactness proofs on real Windows and
# macOS, plus a tag-triggered Windows release zip.
#
# The oracle fixtures are generated fresh on each runner WITH THAT MACHINE'S
# LuaJIT (tests/dump_native_fixtures.lua), so a green Windows job is a true
# Lua-vs-C bit-exactness proof on Windows, not a replay of Mac expectations.
# CI has no in-game unlock snapshot; the pool harnesses take a synthetic
# fixture cfg as their snapshot. The legacy Model-3 overlap check uses the
# synthetic non-reward tag_3; Model-6 Charm/Ethereal rewards are covered by the
# native oracle and cumulative refilter tests.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["win-v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.13.0

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: brew install luajit
      - name: Oracle equivalence (Lua vs native, this machine's LuaJIT)
        run: LUAJIT=luajit sh tests/native_equivalence.sh
      - name: Analytical search telemetry
        run: luajit tests/search_estimate.lua
      - name: Native status polling cadence
        run: luajit tests/native_search_polling.lua
      - name: Lua worker progress protocol
        run: luajit tests/lua_search_progress.lua
      - name: Bounded native filesystem reads
        run: luajit tests/nativefs_bounded_read.lua nativefs.lua
      - name: Native filesystem module isolation
        run: luajit tests/nativefs_module_isolation.lua
      - name: Bounded variable pool headers
        run: python3 tests/pool_variable_header.py
      - name: Representative disposable BSP4 Builder estimate
        run: python3 tests/pool_builder_estimate_pipeline.py
      - name: Adaptive BSP4 codec and corruption contract
        run: python3 tests/pool_bsp4.py
      - name: Native BSP4 reader and logical-digest contract
        run: python3 tests/bsp4_native_reader.py
      - name: Exact native arithmetic fast paths
        run: FASTPATH_CASES=1000000 sh tests/native_fastpath_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Vector first-gate differential
        run: sh tests/vector_gate_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures"
      - name: Joker-heavy eight-lane stream-prime differential
        run: BRAINSTORM_FIXTURES_DIR="${TMPDIR:-/tmp}/brainstorm_native_fixtures" sh tests/joker_lane_prime_equivalence.sh
      - name: Native BSP4 writer, resume, merge, and upgrade
        run: python3 tests/pool_native_bsp4.py --snapshot "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Ordered pool event allocation failure
        run: python3 tests/pool_event_failure.py
      - name: Fresh profile-guided native helper builds
        run: BRAINSTORM_NATIVE_SNAPSHOT="${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" sh native/build_pgo.sh train
      - name: PGO search oracle equivalence (no rebuild)
        run: SKIP_BUILD=1 LUAJIT=luajit sh tests/native_equivalence.sh
      - name: PGO pool exact/reference membership and count (no rebuild)
        run: SKIP_BUILD=1 TAG=tag_3 sh tests/seed_pool_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 300000
      - name: PGO Omen, Charm, and frontier paths (no rebuild)
        run: SNAPSHOT="${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" LUAJIT_BIN=luajit bash tests/omen_charm_regression.sh
      - name: Hash/odometer generation equivalence
        run: sh tests/hash_generation_equivalence.sh
      - name: Pool engine vs established reference equivalence
        run: TAG=tag_3 sh tests/seed_pool_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 300000
      - name: Exclusive second-Soul pool criteria
        run: sh tests/seed_pool_soul_depth.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 5000000
      - name: Pool build -> restricted search -> exhaustion e2e
        run: TAG=tag_charm sh tests/pool_search_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Automatic attachment -> real native child -> continuation e2e
        run: python3 tests/pool_attachment_native_e2e.py "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Pool -> refiltered pool intersection e2e
        run: TAG=tag_charm sh tests/pool_refilter_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Deterministic pool artifacts
        run: sh tests/pool_deterministic_artifacts.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Exact locations, voucher routes, Omen, and organizer
        run: |
          sh tests/pool_exact_location_regression.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 1000000
          sh tests/pool_voucher_routes.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
          SNAPSHOT="${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" bash tests/omen_charm_regression.sh
          sh tests/pool_organizer.sh
          sh tests/pool_organizer_web.sh
          python3 tests/pool_builder_delete.py
          python3 tests/pool_attachment.py
          python3 tests/pool_attachment_marker_matrix.py
          luajit tests/pool_attachment_matrix.lua Brainstorm_reroll.lua
          sh tests/pool_attachment_implication.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Pool compression + legacy conversion equivalence
        run: TAG=tag_charm sh tests/pool_compression_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Distributed shard planning + merge equivalence
        run: TAG=tag_charm sh tests/pool_shard_merge_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000003
      - name: Builder pause/resume smoke (SIGINT path)
        run: python3 tests/windows_builder_smoke.py "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: win_spawn quoting rules
        run: luajit tests/win_spawn_test.lua

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          curl -sL -o "$RUNNER_TEMP/zig.zip" "https://ziglang.org/download/${ZIG_VERSION}/zig-windows-x86_64-${ZIG_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP/zigdist"
          cygpath -w "$RUNNER_TEMP/zigdist/zig-windows-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build LuaJIT with MSVC (same toolchain family as the game's runtime)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git %RUNNER_TEMP%\luajit
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd /d %RUNNER_TEMP%\luajit\src
          call msvcbuild.bat
      - name: Export tool paths
        run: |
          echo "LUAJIT=$(cygpath -u "$RUNNER_TEMP")/luajit/src/luajit.exe" >> "$GITHUB_ENV"
          echo "CC=zig cc -target x86_64-windows-gnu" >> "$GITHUB_ENV"
          "$(cygpath -u "$RUNNER_TEMP")/luajit/src/luajit.exe" -v
      - name: Oracle equivalence (Windows LuaJIT vs .exe) — the bit-exactness proof
        run: sh tests/native_equivalence.sh
      - name: Analytical search telemetry
        run: |
          "$LUAJIT" tests/search_estimate.lua
      - name: Native status polling cadence
        run: |
          "$LUAJIT" tests/native_search_polling.lua
      - name: Lua worker progress protocol
        run: |
          "$LUAJIT" tests/lua_search_progress.lua
      - name: Bounded native filesystem reads
        run: |
          "$LUAJIT" tests/nativefs_bounded_read.lua nativefs.lua
      - name: Native filesystem module isolation
        run: |
          "$LUAJIT" tests/nativefs_module_isolation.lua
      - name: Bounded variable pool headers
        run: python tests/pool_variable_header.py
      - name: Representative disposable BSP4 Builder estimate
        run: python tests/pool_builder_estimate_pipeline.py
      - name: Adaptive BSP4 codec and corruption contract
        run: python tests/pool_bsp4.py
      - name: Native BSP4 reader and logical-digest contract
        run: python tests/bsp4_native_reader.py
      - name: Exact native arithmetic fast paths
        run: FASTPATH_CASES=1000000 sh tests/native_fastpath_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Vector first-gate differential
        run: sh tests/vector_gate_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures"
      - name: Joker-heavy eight-lane stream-prime differential
        run: BRAINSTORM_FIXTURES_DIR="${TMPDIR:-/tmp}/brainstorm_native_fixtures" sh tests/joker_lane_prime_equivalence.sh
      - name: Native BSP4 writer, resume, merge, and upgrade
        run: python tests/pool_native_bsp4.py --snapshot "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Ordered pool event allocation failure
        run: python tests/pool_event_failure.py
      - name: Hash/odometer generation equivalence
        run: sh tests/hash_generation_equivalence.sh
      - name: Pool engine vs established reference equivalence
        run: TAG=tag_3 sh tests/seed_pool_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 300000
      - name: Exclusive second-Soul pool criteria
        run: sh tests/seed_pool_soul_depth.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 5000000
      - name: Pool build -> restricted search -> exhaustion e2e
        run: TAG=tag_charm sh tests/pool_search_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Automatic attachment -> real native child -> continuation e2e
        run: python tests/pool_attachment_native_e2e.py "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Pool -> refiltered pool intersection e2e
        run: TAG=tag_charm sh tests/pool_refilter_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Deterministic pool artifacts
        run: sh tests/pool_deterministic_artifacts.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Exact locations, voucher routes, Omen, and organizer
        run: |
          sh tests/pool_exact_location_regression.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 1000000
          sh tests/pool_voucher_routes.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
          SNAPSHOT="${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" LUAJIT_BIN="$LUAJIT" bash tests/omen_charm_regression.sh
          sh tests/pool_organizer.sh
          sh tests/pool_organizer_web.sh
          python tests/pool_builder_delete.py
          python tests/pool_attachment.py
          python tests/pool_attachment_marker_matrix.py
          "$LUAJIT" tests/pool_attachment_matrix.lua Brainstorm_reroll.lua
          sh tests/pool_attachment_implication.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Pool compression + legacy conversion equivalence
        run: TAG=tag_charm sh tests/pool_compression_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000000
      - name: Distributed shard planning + merge equivalence
        run: TAG=tag_charm sh tests/pool_shard_merge_equivalence.sh "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg" 2000003
      - name: In-game launch path (CreateProcessA spawn + status/stop protocol)
        run: |
          "$LUAJIT" tests/win_spawn_test.lua "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Builder pause/resume smoke (CTRL_BREAK path)
        run: python tests/windows_builder_smoke.py "${TMPDIR:-/tmp}/brainstorm_native_fixtures/case1.cfg"
      - name: Python builder headless check
        run: python tools/brainstorm_pool_builder.py --headless-criteria
      - name: Windows release layout and updater safety
        run: python tests/windows_release_layout.py

  release:
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: [macos, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          curl -sL -o "$RUNNER_TEMP/zig.zip" "https://ziglang.org/download/${ZIG_VERSION}/zig-windows-x86_64-${ZIG_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP/zigdist"
          cygpath -w "$RUNNER_TEMP/zigdist/zig-windows-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build native helpers
        run: sh native/build_windows.sh
      - name: Build standalone Seed Pool apps
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name "Seed Pool Builder" tools/pool_builder_web.py
          pyinstaller --onefile --console --name "Seed Pool Organizer" tools/pool_organizer_web.py
      - name: Assemble one safe full Windows package
        run: |
          python release/package_windows.py \
            --builder-exe "dist/Seed Pool Builder.exe" \
            --organizer-exe "dist/Seed Pool Organizer.exe" \
            --search-exe native/brainstorm_native_search.exe \
            --pool-exe native/brainstorm_seed_pool.exe \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/brainstorm-windows-full.zip \
            --title "Brainstorm Windows $GITHUB_REF_NAME" \
            --notes "Brainstorm 1.2.0-alpha for Windows x64. This release adds safe automatic accelerator/authoritative pool attachment, vectorized first gates, direct Charm-source evaluation, deterministic parallel publication, adaptive BSP4 pools, lower-memory pipelined Builder output, faster Joker-heavy and multi-Ante searches, bounded in-game telemetry, and the redesigned Organizer split/combine workflow. Extract the full ZIP and run 'Install or Update Brainstorm.bat'; seed pools, settings, snapshots, and checkpoints are preserved. Existing BSP3 pools remain readable, but BSP4 pools require this release or newer. Built from $GITHUB_SHA after the full Lua/native, pool-route, Soul-depth, attachment, BSP4 corruption, deterministic publication, Organizer, shard/merge, pause/resume, installer, and Windows/macOS equivalence suites passed."
