# Brainstorm exhaustive seed-pool criteria, schema 1.
# Ranges are inclusive. "Before ante 7" is therefore written as 1..6.
poolver 1

# 0 = all available CPU cores except one. Use a numeric value to cap it.
threads 0

# Numeric seed ranks in the 34^8 space. Use count=100000000 with
# format=count for a quick prevalence/storage estimate, then count=all and
# format=binary for the exhaustive pool.
start 0
count 100000000
checkpoint 16777216
chunk 16384
resume 1
format count

# collect: the first required matching tag occurrences are taken as skips,
# so their missing shops affect physical pack and Soul predictions.
# observe: require the tags but assume their blinds are played.
tag_route collect

tag tag_rare 3 9 1
tag tag_negative 3 9 1

# Current verified semantics are specifically the run's FIRST Soul.
legendary j_perkeo 1 6
end
